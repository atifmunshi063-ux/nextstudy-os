<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090D0B"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#10B981" stroke-opacity="0.25" stroke-width="4"/>
  <defs>
    <linearGradient id="grad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="70" y="70" width="372" height="372" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle glow -->
  <circle cx="256" cy="256" r="140" fill="#10B981" fill-opacity="0.08"/>
  <!-- Focus Ring -->
  <circle cx="256" cy="256" r="150" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 16" filter="url(#glow)"/>
  <!-- Graduation / Shield / Apex symbol -->
  <path d="M256 140 L380 200 L256 260 L132 200 Z" fill="url(#grad)"/>
  <!-- Bottom Tassel & Check Chevron -->
  <path d="M190 270 L256 310 L322 270 V320 C322 360 256 385 256 385 C256 385 190 360 190 320 Z" fill="#111813" stroke="url(#grad)" stroke-width="10"/>
  <!-- Checkmark center -->
  <path d="M225 320 L248 342 L290 295" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
